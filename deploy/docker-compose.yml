services:
  mysql:
    image: mysql:8.0
    container_name: craftbean-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-craftbean}
      MYSQL_USER: ${MYSQL_USER:-craftbean}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-craftbean123}
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-root123}"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mysql-data:
